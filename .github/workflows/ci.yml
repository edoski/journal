name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  gate:
    # The Python packages and the study app, through tools/check.py. The
    # project targets macOS. The venv sits at .venv because the app runs the
    # engine as <repository>/.venv/bin/python, so its real-engine tests run.
    name: Python and app gate
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: learnharness/package-lock.json
      - run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - run: npm ci
        working-directory: learnharness
      - run: .venv/bin/python tools/check.py
        env:
          LH_REQUIRE_REAL_ENGINE: "1"

  standalone:
    # The study app's desktop server payload, on Apple Silicon like the app.
    name: App standalone
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: learnharness
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: learnharness/package-lock.json
      - run: npm ci
      - name: Native renderer tests
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      - run: npm run build
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
