[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "journal-sync"
version = "0.0.0"
description = "Daily/periodic journal sync automation"
requires-python = ">=3.10"
readme = "AGENTS.md"
authors = [{ name = "Edo", email = "edo@example.com" }]

[project.optional-dependencies]
dev = [
    "hypothesis",
    "import-linter",
    "mypy",
    "pyright",
    "pytest-cov",
    "pytest",
    "ruff==0.15.0",
]

[tool.setuptools.packages.find]
include = ["sync*"]

[tool.coverage.run]
branch = true
source = ["sync"]

[tool.coverage.report]
show_missing = true
skip_covered = true
