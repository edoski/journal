[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "journal-sync"
version = "0.0.0"
description = "Daily/periodic journal sync automation"
requires-python = ">=3.10"
readme = "AGENTS.md"
authors = [{ name = "Edo", email = "edo@example.com" }]

[project.optional-dependencies]
dev = [
    "hypothesis",
    "import-linter",
    "mypy",
    "pytest-cov",
    "pytest",
    "ruff==0.15.0",
]

[tool.setuptools.packages.find]
include = ["sync*", "learning*"]

[tool.setuptools.package-data]
learning = ["skills/tutor/SKILL.md", "skills/tutor/references/*.md"]

[tool.coverage.run]
branch = true
source = ["sync", "learning"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --tb=short"
