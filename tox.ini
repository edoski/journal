[tox]
envlist = fast, full, mutation
skip_missing_interpreters = true

[testenv]
basepython = python3
package = skip
deps =
    deptry
    hypothesis
    import-linter
    mypy
    mutmut
    pip-audit
    pyright
    pytest
    pytest-cov
    ruff
    vulture

[testenv:fast]
description = Fast local feedback gate
commands =
    ruff check .
    ruff format --check .
    pyright
    mypy sync/ --strict
    python -m pytest tests/ -o addopts="-v --tb=short"

[testenv:full]
description = Full pre-commit quality gate
commands =
    ruff check .
    ruff format --check .
    pyright
    mypy sync/ --strict
    vulture sync/ --min-confidence 80
    lint-imports --config .importlinter
    deptry . --pep621-dev-dependency-groups dev --package-module-name-map tox=tox
    pip-audit --progress-spinner off
    python -m pytest tests/ -v

[testenv:mutation]
description = Mutation testing gate
commands =
    mutmut run

[testenv:all]
description = Full plus mutation gates
depends =
    full
    mutation
commands =
    python -c "print('Completed full and mutation gates')"
