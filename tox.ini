[tox]
envlist = check, audit, mutation
skip_missing_interpreters = true

[testenv]
basepython = python3
package = skip
deps =
    deptry
    hypothesis
    import-linter
    mypy
    mutmut
    pip-audit
    pyright
    pytest
    pytest-cov
    ruff
    vulture

[testenv:check]
description = Standard deterministic quality gate
commands =
    ruff check .
    ruff format --check .
    pyright
    mypy sync/ --strict
    vulture sync/ --min-confidence 80
    lint-imports --config .importlinter
    deptry . --pep621-dev-dependency-groups dev --package-module-name-map tox=tox
    python -m pytest tests/ -o addopts="-q --tb=short --cov=sync --cov-branch --cov-report= --cov-fail-under=78"

[testenv:audit]
description = Security audit gate
commands =
    pip-audit --progress-spinner off

[testenv:mutation]
description = Mutation testing gate
commands =
    mutmut run

[testenv:all]
description = Everything gate (check + audit + mutation)
depends =
    check
    audit
    mutation
commands =
    python -c "print('Completed check, audit, and mutation gates')"
