[tox]
envlist = check, extended
skip_missing_interpreters = true

[testenv]
basepython = python3
package = skip

[testenv:check]
description = Standard deterministic quality gate
deps =
    deptry
    hypothesis
    import-linter
    mypy
    pyright
    pytest
    pytest-cov
    ruff
    vulture
commands =
    ruff check .
    ruff format --check .
    pyright
    mypy sync/ --strict
    vulture sync/ --min-confidence 80
    lint-imports --config .importlinter
    deptry . --pep621-dev-dependency-groups dev --package-module-name-map tox=tox,mutmut=mutmut,pip-audit=pip_audit
    python -m pytest tests/ -o addopts="-q --tb=short --cov=sync --cov-branch --cov-report= --cov-fail-under=78"

[testenv:extended]
description = Extended gate (security audit + mutation testing)
deps =
    hypothesis
    mutmut
    pip-audit
commands =
    pip-audit --progress-spinner off
    python -c "from pathlib import Path; import shutil; shutil.rmtree(Path('mutants'), ignore_errors=True)"
    mutmut run --max-children 1
    python tools/mutation_gate.py

[testenv:all]
description = Everything gate (check + extended)
depends =
    check
    extended
commands =
    python -c "print('Completed check and extended gates')"
